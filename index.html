<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>p1ae — Bio, Staff Experience & Projects</title>
<meta name="description" content="p1ae — Minecraft PvP screensharer, and developer. Bio, staff experience and open-source projects." />
<meta property="og:title" content="p1ae" />
<meta property="og:description" content="Bio, staff experience and GitHub projects of p1ae." />
<link rel="icon" href="https://github.com/p1aegg.png" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800&display=swap" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html,body{background:#0a0a0b;color:#e4e4e7;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
  .line-clamp-3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .tab-btn[data-active="true"]{background:#fff;color:#000}
  .tab-btn{color:#d4d4d8}
  .hidden-tab{display:none}
  .spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .pulse{animation:pulse 2s cubic-bezier(.4,0,.6,1) infinite}
  @keyframes pulse{50%{opacity:.5}}
</style>
</head>
<body class="min-h-screen relative overflow-x-hidden flex flex-col">

<div class="pointer-events-none fixed inset-0 -z-10">
  <div class="absolute -top-40 -left-40 h-[500px] w-[500px] rounded-full bg-fuchsia-500/10 blur-[120px]"></div>
  <div class="absolute top-1/3 -right-40 h-[500px] w-[500px] rounded-full bg-cyan-500/10 blur-[120px]"></div>
  <div class="absolute bottom-0 left-1/3 h-[400px] w-[400px] rounded-full bg-violet-500/10 blur-[120px]"></div>
</div>

<div class="mx-auto max-w-6xl px-4 sm:px-6 py-10 sm:py-16 flex flex-col flex-1 w-full">

  <!-- Header -->
  <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-6">
    <div class="flex items-center gap-4">
      <img src="https://github.com/p1aegg.png" alt="p1ae" class="h-16 w-16 rounded-full ring-2 ring-white/10 object-cover" />
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight" id="profile-name"></h1>
        <p class="text-sm text-zinc-400" id="profile-bio"></p>
      </div>
    </div>
    <div class="flex items-center gap-2" id="header-links"></div>
  </header>

  <!-- Tabs -->
  <main class="mt-10 flex-1">
    <div class="grid w-full grid-cols-3 bg-white/[0.04] border border-white/10 h-12 rounded-xl p-1 gap-1">
      <button class="tab-btn rounded-lg text-sm font-medium transition" data-tab="bio" data-active="true"><i class="fa-solid fa-user mr-2"></i>Bio</button>
      <button class="tab-btn rounded-lg text-sm font-medium transition" data-tab="staff"><i class="fa-solid fa-briefcase mr-2"></i>Staff Experience</button>
      <button class="tab-btn rounded-lg text-sm font-medium transition" data-tab="projects"><i class="fa-brands fa-github mr-2"></i>Projects</button>
    </div>

    <!-- BIO -->
    <section class="tab-panel mt-8" data-panel="bio">
      <div class="grid gap-6 lg:grid-cols-3">
        <div class="lg:col-span-1 rounded-2xl border border-white/10 bg-white/[0.03] backdrop-blur p-6">
          <h2 class="text-xs uppercase tracking-[0.2em] text-zinc-500 mb-4">About</h2>
          <dl class="space-y-3 text-sm" id="about-rows"></dl>
          <p class="mt-6 text-sm text-zinc-400 leading-relaxed" id="about-bio"></p>
        </div>
        <div class="lg:col-span-2 rounded-2xl border border-white/10 bg-white/[0.03] backdrop-blur p-6">
          <h2 class="text-xs uppercase tracking-[0.2em] text-zinc-500 mb-4">Links</h2>
          <div class="grid sm:grid-cols-2 gap-3" id="bio-links"></div>
        </div>
      </div>
    </section>

    <!-- STAFF -->
    <section class="tab-panel mt-8 hidden-tab" data-panel="staff">
      <div class="space-y-6">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-2" id="staff-filters"></div>
          <div class="text-xs text-zinc-500" id="staff-counts"></div>
        </div>
        <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3" id="staff-grid"></div>
      </div>
    </section>

    <!-- PROJECTS -->
    <section class="tab-panel mt-8 hidden-tab" data-panel="projects">
      <div class="space-y-6">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-3">
            <a id="gh-link" target="_blank" rel="noreferrer" class="inline-flex items-center gap-2 text-sm text-zinc-300 hover:text-white"><i class="fa-brands fa-github"></i> <span></span></a>
            <button id="refresh-btn" class="inline-flex items-center gap-1.5 text-xs rounded-md border border-white/10 bg-white/[0.03] px-2.5 py-1.5 text-zinc-400 hover:text-zinc-100 hover:bg-white/[0.08]"><i class="fa-solid fa-rotate"></i> Refresh</button>
          </div>
          <label class="flex items-center gap-2 text-xs text-zinc-400 cursor-pointer">
            <input type="checkbox" id="show-forks" class="accent-white" /> Show forks
          </label>
        </div>
        <div id="projects-grid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
      </div>
    </section>
  </main>

  <footer class="mt-16 pt-8 border-t border-white/5 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-zinc-500">
    <span>© <span id="year"></span> p1ae</span>
    <span class="font-mono"><i class="fa-solid text-rose-500/80"></i></span>
  </footer>
</div>

<div id="proof-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/80 p-4">
  <button type="button" id="proof-modal-close" class="absolute top-4 right-4 text-3xl leading-none text-white/90 hover:text-white">×</button>
  <div class="max-w-full max-h-full overflow-hidden rounded-3xl border border-white/10 bg-slate-950/95 p-4">
    <img id="proof-modal-img" alt="Proof image" class="max-w-[90vw] max-h-[80vh] object-contain rounded-xl" />
  </div>
</div>

<script>
/* ---------------- DATA ---------------- */
const GITHUB_USERNAME = "p1aegg";
const PROFILE = { name:"p1ae", age:"16", location:"New York, USA", language:"English",
  bio:"Minecraft PvP screensharer, and developer." };

const LINKS = [
  { name:"YouTube", role:"@p1aeQT", icon:"fa-brands fa-youtube", color:"#FF0000", link:"https://www.youtube.com/@p1aeQT" },
  { name:"GitHub",  role:"p1aegg", icon:"fa-brands fa-github",  color:"#ffffff", link:"https://github.com/p1aegg" },
  { name:"Discord", role:".p1ae",  icon:"fa-brands fa-discord", color:"#5865F2", link:"https://discord.com/users/1362022658291535932" },
  { name:"Discord", role:"SS Tools and Updates",  icon:"fa-brands fa-discord", color:"#5865F2", link:"https://discord.gg/aRGFyn2ZHH" }
];

const CURRENT_STAFF = [
  { serverName:"Sunlight Tiers", role:"HELPER + HEAD SS", color:"#4ade80", discord:"https://discord.gg/UrnCh9ZT2V", imgur:"https://i.imgur.com/frWti2l.png" },
  { serverName:"Lunar Tiers", role:"SS VERIFIED", color:"#e879f9", discord:"https://discord.gg/KrVJCyyFhn", imgur:"https://imgur.com/bvBpnMH.png" },
  { serverName:"Apex Tiers", role:"SS VERIFIED", color:"#e879f9", discord:"https://discord.gg/kdus8ySfGr", imgur:"https://i.imgur.com/cONhi8t.png" },
  { serverName:"Astral Tiers", role:"SS VERIFIED", color:"#4ade80", discord:"https://discord.gg/uqXAM3stsm", imgur:"https://imgur.com/8byEEtM.png" },
  { serverName:"Silence VTL", role:"SS VERIFIED", color:"#4ade80", discord:"https://discord.gg/5fQjwy28xf", imgur:"https://imgur.com/ljUdk2O.png" },
];

const PAST_STAFF = [
  { serverName:"Rift Tiers", role:"MANAGER + SS VERIFIED", color:"#34d399", discord:"", imgur:"" },
  { serverName:"Aple Tiers", role:"MOD + SS VERIFIED", color:"#60a5fa", discord:"", imgur:"" },
  { serverName:"Crystal Ranked", role:"MOD", color:"#38bdf8", discord:"https://discord.gg/3dqdeb8W", imgur:"https://i.imgur.com/bwcoXTv.png" },
  { serverName:"Prot RKS Tiers", role:"MOD", color:"#f0b429", discord:"", imgur:"" },
  { serverName:"West Vanilla", role:"Helper", color:"#f0b429", discord:"", imgur:"" },
  { serverName:"Lucnoxity Tiers", role:"TRAINEE", color:"#f87171", discord:"https://discord.gg/PJXBQaYc2", imgur:"https://i.imgur.com/BIRYx0A.png" },
  { serverName:"Nexus Tiers", role:"SS VERIFIED", color:"#a78bfa", discord:"https://discord.gg/juFaffmvDp", imgur:"https://i.imgur.com/O2EjwnY.png" },
  { serverName:"Ranked Network", role:"SS VERIFIED", color:"#fb923c", discord:"", imgur:"https://i.imgur.com/gvdBBsr.png" },
];

const LANG_COLORS = { TypeScript:"#3178c6", JavaScript:"#f1e05a", Python:"#3572A5", Java:"#b07219", HTML:"#e34c26", CSS:"#563d7c", Shell:"#89e051", Go:"#00ADD8", Rust:"#dea584", C:"#555555", "C++":"#f34b7d" };

/* ---------------- HELPERS ---------------- */
const $ = (s,r=document)=>r.querySelector(s);
const el = (tag, attrs={}, ...children)=>{ const n=document.createElement(tag); for(const k in attrs){ if(k==="class") n.className=attrs[k]; else if(k==="style") n.setAttribute("style",attrs[k]); else if(k.startsWith("on")) n.addEventListener(k.slice(2),attrs[k]); else n.setAttribute(k,attrs[k]); } for(const c of children){ if(c==null) continue; n.append(c.nodeType?c:document.createTextNode(c)); } return n; };
const escapeHtml = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&quot;","'":"&#39;"}[c]));

function roleEmoji(r){ const u=r.toUpperCase();
  if(u.includes("OWNER"))return"👑"; if(u.includes("HEAD STAFF"))return"🛡️";
  if(u.includes("HEAD SS"))return"🎯"; if(u.includes("MANAGER"))return"⚙️";
  if(u.includes("ADMIN"))return"🔧"; if(u.includes("MOD"))return"🔨";
  if(u.includes("INTEGRITY"))return"⚖️"; if(u.includes("TIERIST"))return"🏆";
  if(u.includes("VERIFIED"))return"✅"; if(u.includes("SCREENSHARER"))return"🖥️";
  return"✨";
}

/* ---------------- RENDER: HEADER + BIO ---------------- */
$("#profile-name").textContent = PROFILE.name;
$("#profile-bio").textContent  = PROFILE.bio;
$("#year").textContent = new Date().getFullYear();

$("#header-links").innerHTML = LINKS.map(l=>`
  <a href="${l.link}" target="_blank" rel="noreferrer" title="${l.name} — ${l.role}"
     class="grid place-items-center h-10 w-10 rounded-lg border border-white/10 bg-white/[0.03] hover:bg-white/[0.08] hover:border-white/20 transition"
     style="color:${l.color}"><i class="${l.icon}"></i></a>`).join("");

const rows = [["Name",PROFILE.name],["Age",PROFILE.age+" y/o"],["Location",PROFILE.location],["Language",PROFILE.language]];
$("#about-rows").innerHTML = rows.map(([k,v])=>`
  <div class="flex items-center justify-between border-b border-white/5 pb-2 last:border-0">
    <dt class="text-zinc-500">${k}</dt><dd class="text-zinc-200 font-medium">${escapeHtml(v)}</dd>
  </div>`).join("");
$("#about-bio").textContent = PROFILE.bio;

$("#bio-links").innerHTML = LINKS.map(l=>`
  <a href="${l.link}" target="_blank" rel="noreferrer"
     class="group flex items-center gap-3 rounded-xl border border-white/10 bg-white/[0.02] px-4 py-3 hover:bg-white/[0.06] hover:border-white/20 transition">
    <span class="grid place-items-center h-10 w-10 rounded-lg bg-black/40" style="color:${l.color}"><i class="${l.icon} text-lg"></i></span>
    <div class="min-w-0"><div class="font-medium text-zinc-100">${l.name}</div><div class="text-xs text-zinc-500 truncate">${l.role}</div></div>
    <i class="fa-solid fa-arrow-up-right-from-square ml-auto text-zinc-600 group-hover:text-zinc-300 transition"></i>
  </a>`).join("");

/* ---------------- TABS ---------------- */
document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const id = btn.dataset.tab;
    document.querySelectorAll(".tab-btn").forEach(b=>b.dataset.active = (b===btn));
    document.querySelectorAll(".tab-panel").forEach(p=>p.classList.toggle("hidden-tab", p.dataset.panel!==id));
    if(id==="projects" && !window.__loadedRepos){ window.__loadedRepos=true; loadRepos(); }
  });
});

/* ---------------- STAFF ---------------- */
let staffFilter = "current";
function staffCard(e){
  const tiers = e.tiers ? `<ul class="mt-4 space-y-1.5">${e.tiers.map(t=>`
      <li class="flex items-center justify-between text-xs">
        <span class="text-zinc-400">${escapeHtml(t.name)}</span>
        <div class="flex items-center gap-2">
          ${t.discord?`<a href="${t.discord}" target="_blank" rel="noreferrer" class="text-zinc-500 hover:text-indigo-400" title="Discord"><i class="fa-brands fa-discord"></i></a>`:""}
          ${t.imgur?`<button type="button" data-imgur="${t.imgur}" class="proof-btn text-zinc-500 hover:text-emerald-400" title="Proof"><i class="fa-solid fa-image"></i></button>`:""}
        </div>
      </li>`).join("")}</ul>` : "";
  const buttons = (!e.tiers && (e.discord||e.imgur)) ? `<div class="mt-4 flex items-center gap-2">
    ${e.discord?`<a href="${e.discord}" target="_blank" rel="noreferrer" class="inline-flex items-center gap-1.5 text-xs rounded-md border border-white/10 bg-white/[0.03] px-2.5 py-1.5 text-zinc-300 hover:bg-white/[0.08]"><i class="fa-brands fa-discord"></i> Discord</a>`:""}
    ${e.imgur?`<button type="button" data-imgur="${e.imgur}" class="proof-btn inline-flex items-center gap-1.5 text-xs rounded-md border border-white/10 bg-white/[0.03] px-2.5 py-1.5 text-zinc-300 hover:bg-white/[0.08]"><i class="fa-solid fa-image"></i> Proof</button>`:""}
  </div>` : "";
  return `<div class="group relative rounded-2xl border border-white/10 bg-gradient-to-b from-white/[0.04] to-white/[0.01] p-5 hover:border-white/20 hover:from-white/[0.06] transition" style="box-shadow:inset 0 1px 0 0 ${e.color}10">
    <div class="flex items-start justify-between gap-3">
      <div class="min-w-0">
        <div class="flex items-center gap-2 text-zinc-100 font-semibold truncate">
          <span aria-hidden>${roleEmoji(e.role)}</span><span class="truncate">${escapeHtml(e.serverName)}</span>
        </div>
        <span class="inline-block mt-2 px-2 py-0.5 rounded-md text-[10px] tracking-wider font-semibold" style="color:${e.color};background:${e.color}14">${escapeHtml(e.role)}</span>
      </div>
    </div>
    ${tiers}${buttons}
  </div>`;
}
function bindProofButtons(){
  document.querySelectorAll(".proof-btn").forEach(btn=>{
    if(btn.dataset.bound) return;
    btn.dataset.bound = "true";
    btn.addEventListener("click",()=>{
      const url = btn.dataset.imgur;
      if(!url) return;
      $("#proof-modal-img").src = url;
      $("#proof-modal").classList.remove("hidden");
    });
  });
}
function renderStaff(){
  const list = staffFilter==="current"?CURRENT_STAFF : staffFilter==="past"?PAST_STAFF : [...CURRENT_STAFF,...PAST_STAFF];
  $("#staff-grid").innerHTML = list.map(staffCard).join("");
  bindProofButtons();
  $("#staff-counts").textContent = `${CURRENT_STAFF.length} current · ${PAST_STAFF.length} past`;
  $("#staff-filters").innerHTML = ["current","past","all"].map(k=>`
    <button data-filter="${k}" class="px-3 py-1.5 rounded-lg text-xs font-medium border transition ${staffFilter===k?"bg-white text-black border-white":"bg-white/[0.03] text-zinc-400 border-white/10 hover:bg-white/[0.08] hover:text-zinc-200"}">${k==="current"?"Current":k==="past"?"Past":"All"}</button>`).join("");
  $("#staff-filters").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{ staffFilter=b.dataset.filter; renderStaff(); }));
}
renderStaff();

/* ---------------- PROJECTS ---------------- */
$("#gh-link").href = `https://github.com/${GITHUB_USERNAME}`;
$("#gh-link").querySelector("span").textContent = `github.com/${GITHUB_USERNAME}`;
let repos = [];
let showForks = false;
$("#show-forks").addEventListener("change",e=>{ showForks=e.target.checked; renderRepos(); });
$("#refresh-btn").addEventListener("click",loadRepos);

function renderRepos(){
  const list = repos.filter(r=>!r.archived).filter(r=>showForks?true:!r.fork)
    .sort((a,b)=>b.stargazers_count-a.stargazers_count || new Date(b.updated_at)-new Date(a.updated_at));
  if(!list.length){ $("#projects-grid").innerHTML = `<div class="text-sm text-zinc-400">No public repositories.</div>`; return; }
  $("#projects-grid").innerHTML = list.map(r=>`
    <a href="${r.html_url}" target="_blank" rel="noreferrer" class="group flex flex-col rounded-2xl border border-white/10 bg-gradient-to-b from-white/[0.04] to-white/[0.01] p-5 hover:border-white/20 hover:from-white/[0.07] transition">
      <div class="flex items-start justify-between gap-2">
        <div class="flex items-center gap-2 text-zinc-100 font-semibold truncate">
          <i class="fa-regular fa-folder text-zinc-500"></i><span class="truncate">${escapeHtml(r.name)}</span>
          ${r.fork?'<span class="text-[10px] text-zinc-500 font-normal">fork</span>':""}
        </div>
        <i class="fa-solid fa-arrow-up-right-from-square text-zinc-600 group-hover:text-zinc-200 transition"></i>
      </div>
      <p class="mt-2 text-sm text-zinc-400 line-clamp-3 min-h-[3.75rem]">${r.description?escapeHtml(r.description):'<span class="text-zinc-600 italic">No description provided.</span>'}</p>
      <div class="mt-4 flex items-center gap-4 text-xs text-zinc-400">
        ${r.language?`<span class="inline-flex items-center gap-1.5"><span class="h-2.5 w-2.5 rounded-full" style="background:${LANG_COLORS[r.language]||'#888'}"></span>${r.language}</span>`:""}
        <span class="inline-flex items-center gap-1"><i class="fa-regular fa-star"></i> ${r.stargazers_count}</span>
        <span class="inline-flex items-center gap-1"><i class="fa-solid fa-code-fork"></i> ${r.forks_count}</span>
        <span class="ml-auto text-zinc-600">${new Date(r.updated_at).toLocaleDateString()}</span>
      </div>
    </a>`).join("");
}

function closeProofModal(){
  $("#proof-modal").classList.add("hidden");
  $("#proof-modal-img").src = "";
}

document.addEventListener("click", e=>{
  if(e.target.closest("#proof-modal-close") || e.target.id==="proof-modal"){
    closeProofModal();
  }
});

document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && !$("#proof-modal").classList.contains("hidden")){
    closeProofModal();
  }
});

async function loadRepos(){
  const grid = $("#projects-grid");
  const icon = $("#refresh-btn i");
  icon.classList.add("spin");
  grid.innerHTML = Array.from({length:6}).map(()=>`<div class="h-40 rounded-2xl border border-white/10 bg-white/[0.03] pulse"></div>`).join("");
  try{
    const res = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?per_page=100&sort=updated`);
    if(!res.ok) throw new Error("GitHub API "+res.status);
    repos = await res.json();
    renderRepos();
  }catch(err){
    grid.innerHTML = `<div class="text-sm text-red-400">Couldn't load repositories: ${escapeHtml(err.message)}</div>`;
  }finally{ icon.classList.remove("spin"); }
}
</script>
</body>
</html>
